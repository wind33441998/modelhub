<!DOCTYPE html>
<html lang="en" style="background:#07090e">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelHub — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090e;--card:#111723;--border:#1e2740;--text:#edf2f7;--text-dim:#8896b0;--green:#10b981;--green-dim:#059669;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--disp:"Bricolage Grotesque",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--body:"DM Sans",system-ui,sans-serif;--maxw:560px;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.wrap{width:100%;max-width:var(--maxw)}
a.back{color:var(--text-dim);text-decoration:none;font-size:13px;margin-bottom:24px;display:inline-block}
a.back:hover{color:var(--text)}
.logo{font-family:var(--disp);font-weight:800;font-size:22px;text-align:center;margin-bottom:8px}
.logo span{background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px;margin-top:16px}
.tier-name{font-family:var(--disp);font-size:26px;font-weight:800}
.price{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--green);margin:8px 0}
.price-sub{color:var(--text-dim);font-size:13px}
.order-summary{margin-top:14px;padding:14px 16px;background:#0c101a;border:1px solid rgba(16,185,129,.22);border-radius:10px;font-size:13px;color:var(--text-dim);line-height:1.6}
.order-summary b{color:var(--text)}
.order-summary .ok{color:var(--green);font-weight:700}
.order-summary .warn{color:var(--amber);font-weight:600}
label{display:block;font-size:13px;color:var(--text-dim);margin:20px 0 6px}
input[type=email]{width:100%;padding:14px 16px;border-radius:10px;background:#0c101a;border:1px solid var(--border);color:var(--text);font-size:15px;font-family:var(--body)}
input[type=email]:focus{outline:none;border-color:var(--green)}
.btn{padding:14px 28px;border-radius:10px;font-weight:700;font-size:15px;border:none;cursor:pointer;width:100%;margin-top:18px}
.btn-primary{background:var(--green);color:#000}
.btn-primary:hover{box-shadow:0 0 24px rgba(16,185,129,.3)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:16px;font-size:14px;min-height:20px}
.ok{color:var(--green)} .err{color:var(--red)} .info{color:var(--text-dim)}
.license-box{background:#0c101a;border:1px solid var(--green);border-radius:10px;padding:16px;margin-top:18px;text-align:center}
.license-key{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--green);margin:8px 0;word-break:break-all}
.copy-btn{background:var(--green);color:#000;border:none;padding:8px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;margin-top:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--text-dim);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
footer{margin-top:32px;color:var(--text-dim);font-size:12px;text-align:center}
.note{font-size:12px;color:var(--text-dim);margin-top:12px;text-align:center}
.note a{color:var(--green);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; Back to ModelHub</a>
  <div id="refNotice" class="hidden" style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--green);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:16px"></div>
  <div class="logo"><span>◆</span> ModelHub</div>

  <div class="card" id="main">
    <div class="tier-name" id="tierName">Loading…</div>
    <div class="price" id="price">—</div>
    <div class="price-sub" id="priceSub"></div>
    <div class="order-summary hidden" id="orderSummary"></div>

    <div id="emailWrap">
      <label for="email">Your email (license will be sent here)</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div id="gumroadWrap">
      <button class="btn btn-primary" id="gumroadBtn">Continue to Gumroad →</button>
    </div>

    <button class="btn btn-primary hidden" id="trialBtn">Get Free Trial →</button>

    <div id="status" class="info"></div>

    <div class="note" id="gumroadNote">Secure checkout via Gumroad. After payment, retrieve your license key at <a href="https://webhook.claude-proxys.com/retrieve.html" target="_blank">webhook.claude-proxys.com/retrieve.html</a> with your email.</div>

    <div id="licenseWrap" class="license-box hidden">
      <div style="font-size:13px;color:var(--text-dim)">Your license key</div>
      <div class="license-key" id="licenseKey"></div>
      <button class="copy-btn" id="copyBtn">Copy</button>
      <div style="margin-top:12px"><a href="/dashboard" style="color:var(--green);font-size:13px;text-decoration:none">Open Dashboard →</a></div>
    </div>
  </div>

  <footer>Not affiliated with Anthropic, OpenAI, or any API provider. Payments via Gumroad.</footer>
</div>

<script>
// License Server (handles referral apply + trial register). Static Pages has no backend.
const API = "https://webhook.claude-proxys.com";
const GUMROAD_BASE = "https://gumroad.com/l/swpiot";

// One Gumroad product per tier (created 2026-08-02 via Gumroad dashboard). Each is a
// single FIXED price, so the selected tier + price carry straight through to Gumroad —
// no version juggling, no "Name a fair price" empty box. webhook.js PERMALINK_MAP maps
// modelhub-{monthly,yearly,lifetime} -> tier automatically.
const GUMROAD_PRODUCTS = {
  monthly:  "https://gumroad.com/l/modelhub-monthly",
  yearly:   "https://gumroad.com/l/modelhub-yearly",
  lifetime: "https://gumroad.com/l/modelhub-lifetime",
};

// Fallback (current state): single versioned product `swpiot`. Gumroad IGNORES
// ?version= URL params, so buyers always land on the default $3 Monthly version
// and must manually pick the right plan. We still append it (harmless) and show a
// reminder on this page.
const GUMROAD_VERSIONS = {
  monthly:  "BcIGdq_aC4sCj4lC5olOPQ==",
  yearly:   "WtS09pg8ZjybRj3fs_e9iA==",
  lifetime: "Yrm_ZTDEsoBJA_SmLYRhqQ==",
};

const params = new URLSearchParams(location.search);
// 'free' is a common alias users/externals use for the free trial tier.
const TIER_ALIASES = { free: "trial" };
const VALID_TIERS = { trial:1, monthly:1, yearly:1, lifetime:1 };
let TIER = params.get("tier");
if (TIER && TIER_ALIASES[TIER]) TIER = TIER_ALIASES[TIER];
if (!TIER || !VALID_TIERS[TIER]) {
  const saved = localStorage.getItem("mh_sel_tier");
  TIER = (saved && VALID_TIERS[saved]) ? saved : "yearly";
}
localStorage.setItem("mh_sel_tier", TIER);

const REF = params.get("ref") || localStorage.getItem("mh_ref") || "";
const PRICES = { trial: 0, monthly: 3, yearly: 29, lifetime: 69 };
const TIER_LABEL = { trial: "Free Trial", monthly: "Monthly", yearly: "Yearly", lifetime: "Lifetime" };
const TIER_DAYS = { trial: "7 days free", monthly: "per month", yearly: "per year", lifetime: "one-time" };
const TIER_PERKS = {
  trial:    "DeepSeek only · 4 models · 1 device · no credit card",
  monthly:  "All 8 providers · 24 models · up to 3 devices · email support",
  yearly:   "All 8 providers · 24 models · up to 5 devices · unlimited logs",
  lifetime: "All 8 providers · 24 models · up to 10 devices · forever updates",
};

const $ = (id) => document.getElementById(id);
const setStatus = (msg, cls) => { $("status").className = cls || "info"; $("status").innerHTML = msg; };
const validEmail = (e) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);

// Show referral attribution if arriving via /ref/CODE or ?ref=
if (REF) {
  const n = $("refNotice");
  if (n) {
    n.classList.remove("hidden");
    n.textContent = "🎁 You were referred by a friend — they'll get free time when you complete your purchase.";
  }
}

if (!VALID_TIERS[TIER]) {
  $("tierName").textContent = "Invalid plan";
  $("emailWrap").classList.add("hidden");
  $("gumroadWrap").classList.add("hidden");
  $("trialBtn").classList.add("hidden");
  $("gumroadNote").classList.add("hidden");
  setStatus('This purchase link is invalid or expired. <a href="/#pricing" style="color:var(--green)">Choose a plan →</a>', "err");
} else {
  $("tierName").textContent = TIER_LABEL[TIER] + " License";
  $("price").textContent = TIER === "trial" ? "$0" : "$" + PRICES[TIER];
  $("priceSub").textContent = TIER_DAYS[TIER];
  const os = $("orderSummary");
  os.classList.remove("hidden");
  let html = "<span class='ok'>✓ You are buying:</span> <b>" + TIER_LABEL[TIER] + " — $" + PRICES[TIER] +
    (TIER === "lifetime" ? " (one-time)" : TIER === "monthly" ? " /month" : TIER === "yearly" ? " /year" : "") +
    "</b><br>" + TIER_PERKS[TIER];
  if (!GUMROAD_PRODUCTS[TIER]) {
    html += "<br><span class='warn'>⚠ After Continue, on the Gumroad page select the <b>" + TIER_LABEL[TIER] +
      " ($" + PRICES[TIER] + ")</b> plan before paying.</span>";
  }
  os.innerHTML = html;
  if (TIER === "trial") {
    $("gumroadWrap").classList.add("hidden");
    $("gumroadNote").classList.add("hidden");
    $("trialBtn").classList.remove("hidden");
    $("trialBtn").onclick = doTrial;
  } else {
    $("gumroadBtn").onclick = goGumroad;
  }
}

// Referral intent: record (code,email) on License Server BEFORE leaving for Gumroad.
async function goGumroad() {
  const email = $("email").value.trim();
  if (!validEmail(email)) { setStatus("Please enter a valid email first.", "err"); return; }
  $("gumroadBtn").disabled = true;
  setStatus("Recording referral…", "info");
  if (REF) {
    try {
      const r = await fetch(API + "/api/referral/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: REF, referee_email: email }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) console.warn("[referral] apply failed:", j.error || r.status);
      else console.log("[referral] applied", REF, "for", email);
    } catch (e) {
      console.warn("[referral] apply error:", e.message);
    }
  }
  // Use the dedicated per-tier product if configured; otherwise the single versioned
  // product (buyer must pick the plan on Gumroad — Gumroad ignores ?version=).
  const productUrl = GUMROAD_PRODUCTS[TIER] || GUMROAD_BASE;
  let gum = productUrl + "?email=" + encodeURIComponent(email);
  if (!GUMROAD_PRODUCTS[TIER]) {
    const vid = GUMROAD_VERSIONS[TIER];
    if (vid) gum += "&version=" + encodeURIComponent(vid);
  }
  window.location.href = gum;
}

async function doTrial() {
  const email = $("email").value.trim();
  if (!validEmail(email)) { setStatus("Please enter a valid email first.", "err"); return; }
  $("trialBtn").disabled = true;
  setStatus('<span class="spinner"></span>Creating your free trial…', "info");
  try {
    const r = await fetch(API + "/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, tier: "trial" }),
    });
    const j = await r.json();
    if (!r.ok) { setStatus(j.error || "Trial creation failed.", "err"); $("trialBtn").disabled = false; return; }
    showLicense({ license_key: j.license_key });
  } catch (e) {
    setStatus("Network error: " + e.message, "err");
    $("trialBtn").disabled = false;
  }
}

function showLicense(j) {
  $("gumroadWrap")?.classList.add("hidden");
  $("trialBtn")?.classList.add("hidden");
  $("gumroadNote")?.classList.add("hidden");
  $("licenseWrap").classList.remove("hidden");
  $("licenseKey").textContent = j.license_key;
  localStorage.setItem("mh_mycode", j.license_key);
  setStatus("Your license is ready. Paste it into ModelHub → Activate.", "ok");
  $("copyBtn").onclick = () => {
    navigator.clipboard.writeText(j.license_key).then(() => { $("copyBtn").textContent = "Copied!"; setTimeout(() => ($("copyBtn").textContent = "Copy"), 1500); });
  };
}
</script>
</body>
</html>
